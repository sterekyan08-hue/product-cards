<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product cards</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="main">
        <div class="main__card">
            <img class="photo" src="./img/nova-x.jpg" alt="">
            <h2 class="name">Nova X</h2>
            <p class="description">OLED-дисплей и двойная камера.</p>
            <div class="card__price">
                <h2 class="price">49 990 ₽</h2>
                <button class="buy">Купить</button>
            </div>
        </div>
        <div class="main__card">
            <img class="photo" src="./img/sonic-pro.jpg" alt="">
            <h2 class="name">Sonic Pro</h2>
            <p class="description">Полноразмерные беспроводные наушники с активным шумоподавлением, поддержкой быстрой зарядки и автономностью до 40 часов.</p>
            <div class="card__price">
                <h2 class="price">12 490 ₽</h2>
                <button class="buy">Купить</button>
            </div>
        </div>
        <div class="main__card">
            <img class="photo" src="./img/pulse-watch.jpg" alt="">
            <h2 class="name">Pulse Watch</h2>
            <p class="description">Умные часы для спорта и отслеживания активности.</p>
            <div class="card__price">
                <h2 class="price">18 990 ₽</h2>
                <button class="buy">Купить</button>
            </div>
        </div>
    </div>
</body>
</html>
